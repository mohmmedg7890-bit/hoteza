<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/app.css"></head><body class="document"><nav class="no-print"><button onclick="window.print()">طباعة</button>{% for f in 'x' %}<a class="button" href="/export/{{ kind }}-{{ pk }}/pdf/">PDF</a><a class="button" href="/export/{{ kind }}-{{ pk }}/docx/">Word</a><a class="button" href="/export/{{ kind }}-{{ pk }}/xlsx/">Excel</a><a class="button" href="/export/{{ kind }}-{{ pk }}/png/">صورة</a>{% endfor %}</nav><article class="paper"><div class="eyebrow">HOTEZA · مستندات التشغيل</div><h1>{{ title }}</h1><p class="notice">مستند تجريبي — غير صالح كفاتورة إلكترونية نظامية</p><table><tbody>{% for line in lines %}<tr>{% for value in line %}<td>{{ value }}</td>{% endfor %}</tr>{% endfor %}</tbody></table><p>تم الإنشاء بواسطة Hoteza · احتفظ بمرجع المستند عند مراجعة الحساب.</p></article></body></html>
