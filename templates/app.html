<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoteza | إدارة المنشأة</title><link rel="stylesheet" href="/static/app.css"></head><body>
<aside id="sidebar"><a class="brand" href="#dashboard"><b>H</b><span>HOTEZA<small>مساحة تشغيل الضيافة</small></span></a><nav id="nav"></nav><div class="sidefoot"><span id="identity"></span><form action="/logout/" method="post">{% csrf_token %}<button>تسجيل الخروج</button></form></div></aside>
<main><header><button id="menu" aria-label="فتح القائمة">☰</button><span id="breadcrumb">لوحة المعلومات</span><div class="header-actions"><select id="property" aria-label="المنشأة">{% for m in memberships %}<option value="{{ m.property_id }}">{{ m.property.name }}</option>{% endfor %}</select><button data-open="booking" class="primary">＋ حجز جديد</button></div></header>
<div class="notice">نسخة تجريبية بقاعدة بيانات فعلية — مستندات الفوترة للتجربة وليست معتمدة ضريبيًا.</div><div id="page"></div></main>
<dialog id="modal"><form id="modalform"><div class="dialoghead"><h2 id="modal-title"></h2><button type="button" id="close-modal" aria-label="إغلاق">×</button></div><div id="fields"></div><p id="form-error" class="error" role="alert"></p><footer><button type="button" id="cancel-modal">إلغاء</button><button type="submit" class="primary" id="save">حفظ</button></footer></form></dialog>
<div id="toast" role="status"></div><script src="/static/app.js" defer></script></body></html>
