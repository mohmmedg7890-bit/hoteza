<!doctype html><html lang="ar" dir="rtl" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoteza | إدارة المنشأة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/app.css?v=checkout-1"></head><body><div class="app-ambient" aria-hidden="true"></div>
<aside id="sidebar"><a class="brand" href="#dashboard"><b>H</b><span>HOTEZA<small>مساحة تشغيل الضيافة</small></span></a><div class="property-context"><strong id="property-name">منشأتك</strong><small>الحجوزات والتوافر والحسابات</small></div><nav id="nav" aria-label="التنقل الرئيسي"></nav><div class="sidefoot"><span id="identity"></span><form action="/logout/" method="post">{% csrf_token %}<button>تسجيل الخروج</button></form></div></aside>
<main><header><button id="menu" aria-label="فتح القائمة">☰</button><div class="workspace-context"><strong id="breadcrumb">لوحة المعلومات</strong><small>مساحة التشغيل · Hoteza</small></div><div class="header-actions"><button type="button" data-appearance-toggle aria-label="تبديل الوضع الفاتح والمظلم" title="تبديل الوضع">◐</button><button type="button" data-appearance-open>✦ المظهر</button><button id="refresh-state" title="تحديث بيانات المنشأة">↻ تحديث</button><select id="property" aria-label="المنشأة">{% for m in memberships %}<option value="{{ m.property_id }}">{{ m.property.name }}</option>{% endfor %}</select><button data-open="booking" class="primary">＋ حجز جديد</button></div></header>
<div class="notice">نسخة تجريبية بقاعدة بيانات فعلية — مستندات الفوترة للتجربة وليست معتمدة ضريبيًا.</div><div id="page"></div></main>
<dialog id="modal" aria-labelledby="modal-title"><form id="modalform"><div class="dialoghead"><h2 id="modal-title"></h2><button type="button" id="close-modal" aria-label="إغلاق">×</button></div><div id="fields"></div><p id="form-error" class="error" role="alert"></p><footer><button type="button" id="cancel-modal">إلغاء</button><button type="submit" class="primary" id="save">حفظ</button></footer></form></dialog>
<div id="toast" role="status"></div><script src="/static/validation.js?v=checkout-1" defer></script><script src="/static/guest-profile.js?v=checkout-1" defer></script><script src="/static/operations-ui.js?v=checkout-1" defer></script><script src="/static/unit-board.js?v=checkout-1" defer></script><script src="/static/app.js?v=checkout-1" defer></script><script src="/static/appearance.js?v=checkout-1" defer></script></body></html>
