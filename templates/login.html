<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoteza | الدخول</title><link rel="stylesheet" href="/static/app.css"><body class="auth"><form method="post" class="auth-card">{% csrf_token %}<span class="eyebrow">HOTEZA · إدارة الضيافة</span><h1>أهلًا بعودتك</h1><p>مساحة واحدة لتشغيل منشأتك ومتابعة حساباتها.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<label>اسم المستخدم<input name="username" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">تسجيل الدخول</button><a href="/password-reset/">نسيت كلمة المرور؟</a><small>نسخة تشغيل تجريبية · المستندات ليست فواتير إلكترونية نظامية</small></form></body></html>
